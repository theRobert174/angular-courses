<h4>Agregar personaje</h4>
<form class="row">

  <input
    [(ngModel)]="character.name"
    name="name"
    type="text"
    class="form-control mb-2"
    placeholder="Nombre">

  <input
    [(ngModel)]="character.power"
    name="power"
    type="number"
    class="form-control mb-2"
    placeholder="Poder">

  <button
    type="submit"
    class="btn btn-primary"
    (click)="emitCharacter()">
    Agregar
  </button>

  <pre>{{character | json}}</pre>
</form>
